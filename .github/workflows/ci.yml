name: Fintech Incident Operations CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate support engineering lab
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: incident-triage-assistant/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r incident-triage-assistant/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            payment-api/app.py \
            provider-simulator/app.py \
            merchant-webhook/app.py \
            webhook-worker/worker.py \
            ledger-worker/worker.py \
            incident-triage-assistant/app/*.py

      - name: Run incident triage tests
        working-directory: incident-triage-assistant
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.override.yml \
            config \
            --no-interpolate \
            --quiet

      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml
